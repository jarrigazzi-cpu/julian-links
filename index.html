<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julián Arrigazzi</title>
<meta name="description" content="Founder de AI ARchitect y Pozo y Mina.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
<style>
  :root{
    --bg:#0b0d10; --panel:#14171b; --border:#262b31;
    --text:#f2f3f5; --muted:#8b939d;
    --accent-ai:#22d3ee; --accent-pym:#d98a44; --accent-li:#5b9bd5;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:
      radial-gradient(ellipse 800px 500px at 50% -10%, rgba(255,255,255,0.05), transparent 60%),
      var(--bg);
    color:var(--text); font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    display:flex; justify-content:center; padding:56px 20px 80px;
  }
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
  .wrap{width:100%; max-width:440px; display:flex; flex-direction:column; align-items:center; gap:28px;}
  .avatar{
    width:92px; height:92px; border-radius:50%;
    background:linear-gradient(145deg,#2a2f36,#14171b);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:34px; font-weight:700; color:var(--text);
  }
  h1{margin:0; font-size:22px; font-weight:700; text-align:center;}
  .tagline{margin:0; color:var(--muted); font-size:14.5px; text-align:center; line-height:1.5; max-width:340px;}
  .links{width:100%; display:flex; flex-direction:column; gap:14px; margin-top:8px;}
  a.card{
    display:flex; align-items:center; gap:14px;
    padding:16px 18px; border-radius:12px;
    background:var(--panel); border:1px solid var(--border);
    text-decoration:none; color:var(--text);
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  a.card:hover{transform:translateY(-2px); background:#181c21;}
  .card .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .card .body{flex:1; min-width:0;}
  .card .title{font-size:15.5px; font-weight:600; margin:0 0 2px;}
  .card .sub{font-size:13px; color:var(--muted); margin:0;}
  .card .arrow{color:var(--muted); font-size:18px;}
  .pym .dot{background:var(--accent-pym); box-shadow:0 0 10px rgba(217,138,68,.6);}
  .ai .dot{background:var(--accent-ai); box-shadow:0 0 10px rgba(34,211,238,.6);}
  .li .dot{background:var(--accent-li); box-shadow:0 0 10px rgba(91,155,213,.6);}
  footer{margin-top:20px; color:var(--muted); font-size:12px; text-align:center;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="avatar">JA</div>
    <h1>Julián Arrigazzi</h1>
    <p class="tagline">Salteño en Neuquén. Founder de Pozo y Mina y AI ARchitect.</p>

    <div class="links">
      <a class="card pym" href="https://pozoymina.com" target="_blank" rel="noopener">
        <span class="dot"></span>
        <span class="body">
          <p class="title">Pozo y Mina</p>
          <p class="sub">Cotizá y compará proveedores — Vaca Muerta y minería Salta</p>
        </span>
        <span class="arrow">↗</span>
      </a>

      <a class="card ai" href="https://ai-architect-arg.netlify.app" target="_blank" rel="noopener">
        <span class="dot"></span>
        <span class="body">
          <p class="title">AI ARchitect</p>
          <p class="sub">Cursos de IA aplicada</p>
        </span>
        <span class="arrow">↗</span>
      </a>

      <a class="card li" href="https://www.linkedin.com/in/jarrigazzisupchain/" target="_blank" rel="noopener">
        <span class="dot"></span>
        <span class="body">
          <p class="title">LinkedIn</p>
          <p class="sub">Conectemos</p>
        </span>
        <span class="arrow">↗</span>
      </a>
    </div>

    <footer>julianarrigazzi.com</footer>
  </div>
</body>
</html>
